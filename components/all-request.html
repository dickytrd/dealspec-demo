<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Request Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --card-scale: 2.4;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      cursor: pointer;
    }

    .all-request-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: visible;
      box-sizing: border-box;
    }

    .all-request {
      width: calc(290px * var(--card-scale));
      max-width: 100%;
      background: #ffffff;
      border-radius: calc(8px * var(--card-scale));
      padding: calc(10px * var(--card-scale));
      display: flex;
      flex-direction: column;
      gap: calc(12px * var(--card-scale));
      filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.08));
      position: relative;
    }

    /* Header */
    .all-request__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .all-request__title {
      font-weight: 500;
      font-size: calc(13px * var(--card-scale));
      color: #070c11;
      letter-spacing: -0.01em;
    }

    .all-request__search {
      display: flex;
      align-items: center;
      gap: calc(6px * var(--card-scale));
      background: #f9fbfc;
      padding: calc(4px * var(--card-scale)) calc(8px * var(--card-scale));
      border-radius: calc(6px * var(--card-scale));
      width: calc(116px * var(--card-scale));
      height: calc(20px * var(--card-scale));
    }

    .all-request__search-icon {
      width: calc(10px * var(--card-scale));
      height: calc(10px * var(--card-scale));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .all-request__search-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .all-request__search-text {
      font-weight: 400;
      font-size: calc(8px * var(--card-scale));
      color: rgba(7, 12, 17, 0.3);
      letter-spacing: -0.01em;
    }

    /* Cards container */
    .all-request__cards {
      display: flex;
      flex-direction: column;
      gap: calc(8px * var(--card-scale));
      position: relative;
    }

    /* Deal card */
    .deal-card {
      width: 100%;
      background: #f5f5f5;
      border-radius: calc(8px * var(--card-scale));
      padding: calc(10px * var(--card-scale));
      display: flex;
      align-items: center;
      gap: calc(8px * var(--card-scale));
      transition: background 0.2s ease, transform 0.4s ease;
    }

    /* Stratton card - popped out by default, slides into list on hover */
    .deal-card--stratton {
      position: relative;
      transform: translateX(calc(24px * var(--card-scale))) rotate(-4deg);
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Hover: Stratton slides back into list */
    .all-request:hover .deal-card--stratton {
      transform: translateX(0) rotate(0deg);
      z-index: 1;
      box-shadow: none;
    }

    .deal-card:hover {
      background: #ffffff;
    }

    /* Checkbox */
    .deal-card__checkbox {
      width: calc(10px * var(--card-scale));
      height: calc(10px * var(--card-scale));
      border: 1px solid rgba(7, 12, 17, 0.3);
      border-radius: calc(2px * var(--card-scale));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      background: transparent;
    }

    .deal-card__checkbox svg {
      width: calc(6px * var(--card-scale));
      height: calc(6px * var(--card-scale));
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease;
    }

    .deal-card:hover .deal-card__checkbox {
      background: #2F6FEB;
      border-color: #2F6FEB;
    }

    .deal-card:hover .deal-card__checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    /* Card content */
    .deal-card__content {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(8px * var(--card-scale));
    }

    .deal-card__left {
      display: flex;
      align-items: flex-start;
      gap: calc(6px * var(--card-scale));
      flex: 1;
      min-width: 0;
    }

    /* Deal icon */
    .deal-card__icon {
      width: calc(22px * var(--card-scale));
      height: calc(22px * var(--card-scale));
      border-radius: calc(4px * var(--card-scale));
      padding: calc(4px * var(--card-scale));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .deal-card__icon--red { background: rgba(218, 18, 18, 0.2); }
    .deal-card__icon--brown { background: rgba(119, 87, 50, 0.2); }
    .deal-card__icon--blue { background: rgba(0, 13, 255, 0.2); }

    .deal-card__icon svg {
      width: calc(14px * var(--card-scale));
      height: calc(13px * var(--card-scale));
    }

    /* Deal info */
    .deal-card__info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: calc(2px * var(--card-scale));
    }

    .deal-card__name {
      font-weight: 500;
      font-size: calc(9px * var(--card-scale));
      color: #070c11;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deal-card__date {
      font-weight: 400;
      font-size: calc(6px * var(--card-scale));
      color: rgba(7, 12, 17, 0.6);
      letter-spacing: -0.01em;
    }

    /* Badge */
    .deal-card__badge {
      padding: calc(4px * var(--card-scale)) calc(8px * var(--card-scale));
      border-radius: calc(4px * var(--card-scale));
      font-weight: 600;
      font-size: calc(6px * var(--card-scale));
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }

    .deal-card__badge--blue {
      background: rgba(0, 13, 255, 0.2);
      color: #000dff;
    }

    .deal-card__badge--green {
      background: rgba(15, 168, 48, 0.2);
      color: #0fa830;
    }

    .deal-card__badge--orange {
      background: rgba(255, 106, 0, 0.2);
      color: #ff6a00;
    }

    /* Responsive scaling */
    @media (max-width: 800px) {
      :root { --card-scale: 2.0; }
    }

    @media (max-width: 700px) {
      :root { --card-scale: 1.8; }
    }

    @media (max-width: 600px) {
      :root { --card-scale: 1.5; }
    }

    @media (max-width: 500px) {
      :root { --card-scale: 1.3; }
    }

    @media (max-width: 420px) {
      :root { --card-scale: 1.1; }
    }

    @media (max-width: 350px) {
      :root { --card-scale: 0.95; }
    }
  </style>
</head>

      if (window.parent !== window) {
        window.parent.postMessage({ type: 'bento-card-click' }, '*');
      }
    });
  </script>
