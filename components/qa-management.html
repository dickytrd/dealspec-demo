<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&amp;A Management Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: transparent;
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    :root {
      --card-scale: 1.15;
    }

    .qa-management-wrapper {
      width: 100%;
      height: 100%;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
      box-sizing: border-box;
    }

    .qa-management {
      /* Figma dimensions: 356.638 × 288px */
      width: calc(357px * var(--card-scale));
      height: calc(288px * var(--card-scale));
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .qa-card-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }

    .qa-card-wrapper--back {
      margin-bottom: calc(-20px * var(--card-scale));
      z-index: 1;
    }

    .qa-card-wrapper--front {
      z-index: 2;
    }

    .qa-card {
      /* Figma card width: 350px */
      width: calc(350px * var(--card-scale));
      background: #ffffff;
      border: 1px solid rgba(7, 12, 17, 0.1);
      border-radius: calc(12px * var(--card-scale));
      padding: calc(16px * var(--card-scale));
      display: flex;
      flex-direction: column;
      gap: calc(12px * var(--card-scale));
      filter: drop-shadow(-4px -4px 6px rgba(0, 0, 0, 0.08));
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Figma rotations */
    .qa-card--back {
      transform: rotate(-3deg);
    }

    .qa-card--front {
      transform: rotate(3deg);
    }

    /* Hover: cards straighten and separate */
    .qa-management:hover .qa-card--back {
      transform: rotate(0deg) translate(calc(-12px * var(--card-scale)), calc(-12px * var(--card-scale)));
    }

    .qa-management:hover .qa-card--front {
      transform: rotate(0deg) translate(calc(12px * var(--card-scale)), calc(12px * var(--card-scale)));
    }

    .qa-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .qa-card__quote-icon {
      width: calc(24px * var(--card-scale));
      height: calc(24px * var(--card-scale));
      flex-shrink: 0;
    }

    .qa-card__quote-icon svg {
      width: 100%;
      height: 100%;
    }

    .qa-card__label {
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: calc(12px * var(--card-scale));
      line-height: 1;
      color: rgba(7, 12, 17, 0.3);
      letter-spacing: -0.12px;
      white-space: nowrap;
    }

    .qa-card__quote {
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: calc(16px * var(--card-scale));
      line-height: 1.4;
      color: #070c11;
      letter-spacing: -0.16px;
    }

    .qa-card__divider {
      width: 100%;
      height: 1px;
      background: rgba(7, 12, 17, 0.1);
    }

    .qa-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .qa-card__meta {
      display: flex;
      align-items: center;
      gap: calc(4px * var(--card-scale));
    }

    .qa-card__person-icon {
      width: calc(16px * var(--card-scale));
      height: calc(16px * var(--card-scale));
      flex-shrink: 0;
    }

    .qa-card__person-icon svg {
      width: 100%;
      height: 100%;
    }

    .qa-card__assigned {
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: calc(12px * var(--card-scale));
      line-height: 1;
      color: rgba(7, 12, 17, 0.3);
      letter-spacing: -0.12px;
      white-space: nowrap;
    }

    .qa-card__status {
      display: flex;
      align-items: center;
      gap: calc(4px * var(--card-scale));
    }

    .qa-card__status-dot {
      width: calc(6px * var(--card-scale));
      height: calc(6px * var(--card-scale));
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Figma colors: #61FF4C (green), #FF4C4C (red) */
    .qa-card__status-dot--answered {
      background: #61FF4C;
    }

    .qa-card__status-dot--pending {
      background: #FF4C4C;
    }

    .qa-card__status-text {
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: calc(12px * var(--card-scale));
      line-height: 1;
      color: rgba(7, 12, 17, 0.3);
      letter-spacing: -0.12px;
      white-space: nowrap;
    }

    /* Responsive scaling — same approach as longlist-cards */
    @media (max-width: 560px) {
      :root { --card-scale: 0.95; }
    }
    @media (max-width: 500px) {
      :root { --card-scale: 0.9; }
    }
    @media (max-width: 440px) {
      :root { --card-scale: 0.85; }
    }
    @media (max-width: 380px) {
      :root { --card-scale: 0.75; }
    }
    @media (max-width: 340px) {
      :root { --card-scale: 0.65; }
    }
    @media (max-width: 300px) {
      :root { --card-scale: 0.55; }
    }
  </style>
</head>
